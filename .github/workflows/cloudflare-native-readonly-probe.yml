name: Native Cloudflare credential readonly probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/cloudflare-native-readonly-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove native credential and zone access without mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx --yes wrangler@4.135.0 whoami
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=zevanory.api.br" -o /tmp/z.json
          node -e 'const d=require("/tmp/z.json"); if(!d.success||d.result.length!==1) process.exit(2); const z=d.result[0]; console.log("ZONE_FOUND="+z.name); console.log("ACCOUNT_ID="+z.account.id); console.log("ZONE_ID="+z.id)'
          echo "MUTATION=0"
