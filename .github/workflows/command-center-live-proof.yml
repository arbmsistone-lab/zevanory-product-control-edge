name: Command center live proof

# Production geometry proof with real data: every tab, 5 viewports, 2 themes.
# Fails on page scroll, local scroll, clipped content/text or overlapping text.
# Output carries only codes and CSS classes (public repository: no business data).
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["scripts/panel-actions-live-audit.mjs"]
  schedule:
    - cron: "41 11 * * *"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Live proof
        run: node scripts/command-center-live-proof.mjs
      - name: Live proof of every panel area (official matrix, both themes)
        if: always()
        run: node scripts/panel-live-proof-all.mjs
      - name: Every panel action and route on production (guards, reads, safe actions, UI clicks)
        if: always()
        run: node scripts/panel-actions-live-audit.mjs
