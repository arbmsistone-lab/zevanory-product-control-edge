name: Commercial Visual Regression
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  production-pin-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/pin-startup-trace.mjs
        env:
          OUT: pin-production-trace
      - run: node scripts/pin-production-certification.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pin-hotfix-production-certification
          path: |
            pin-production-trace/**
            pin-production-proof/**
          retention-days: 90
