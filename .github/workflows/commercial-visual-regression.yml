name: Commercial Visual Regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pin-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/pin-startup-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pin-startup-production-baseline
          path: pin-trace/**
          retention-days: 90
