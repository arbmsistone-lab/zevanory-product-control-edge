name: Control Center PED-Versal Supreme Zero-Debt

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: control-center-ped-zero-debt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "EXACT_SHA=PASS sha=$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install application and auditors
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0 axe-core@4.10.3 lighthouse@12
          npx playwright install --with-deps chromium

      - name: Detector positive and negative self-test
        run: node scripts/control-center-detector-selftest.mjs

      - name: Typecheck and production build
        run: |
          npm run typecheck
          npm run build

      - name: Exhaustive zero-debt static audit
        run: python3 scripts/ped_versal_zero_debt_audit.py

      - name: Start production preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/zpc-vite-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/zpc-vite-preview.log
          exit 1

      - name: Audit 14 areas x 5 viewports x 2 themes
        env:
          CONTROL_CENTER_AUDIT_URL: http://127.0.0.1:4173
        run: node scripts/control-center-ped-runtime.mjs

      - name: Publish runtime audit defects for review
        if: failure()
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f control-center-audit/report.json || exit 0
          rm -rf /tmp/defects && mkdir -p /tmp/defects
          node -e 'const r=require("./control-center-audit/report.json");const fs=require("fs");const bad=r.report.filter(x=>(x.failures||[]).length);fs.writeFileSync("/tmp/defects/defects.json",JSON.stringify(bad,null,2));for(const x of bad){if(x.screenshot&&fs.existsSync(x.screenshot))fs.copyFileSync(x.screenshot,"/tmp/defects/"+require("path").basename(x.screenshot));}'
          echo "${GITHUB_SHA}" > /tmp/defects/SOURCE_SHA
          cd /tmp/defects
          git init -q && git checkout -q -b review/control-center-audit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "audit defects for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:review/control-center-audit
          echo "REVIEW_BRANCH=review/control-center-audit"

      - name: Lighthouse production-candidate audit
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -n1 || true)"
          test -n "$CHROME_PATH"
          for i in 1 2 3; do
            npx lighthouse http://127.0.0.1:4173 --chrome-path="$CHROME_PATH" --chrome-flags="--headless=new --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices --output=json --output-path="control-center-lighthouse-$i.json" --quiet
          done
          cp control-center-lighthouse-2.json control-center-lighthouse.json
          node - <<'NODE'
          const runs=[1,2,3].map(i=>require('./control-center-lighthouse-'+i+'.json'));
          const scores=runs.map(r=>Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,Math.round(v.score*100)])));
          const med=k=>scores.map(x=>x[k]).sort((a,b)=>a-b)[1];
          const s={performance:med('performance'),accessibility:med('accessibility'),'best-practices':med('best-practices')};
          console.log(JSON.stringify({runs:scores,median:s}));
          if(s.performance<90||s.accessibility<100||s['best-practices']<95){console.log('::error title=LIGHTHOUSE_MEDIAN::'+JSON.stringify({median:s,runs:scores}));process.exit(1);}
          NODE

      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-center-ped-supreme-${{ github.sha }}
          path: |
            control-center-audit/
            control-center-lighthouse.json
          retention-days: 90
