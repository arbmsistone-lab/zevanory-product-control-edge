name: Control Center Runtime Truth
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'backend/**', 'scripts/**', '.github/workflows/control-center-truth-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.0 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck && node --import tsx scripts/runtime-state-contract.ts && npm run build
      - run: node scripts/sync-worker-backend.mjs --check && node --import tsx scripts/pr98-backend-contract.ts
      - name: Preview and runtime proofs
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/pr98-adversarial-repro.mjs
          node scripts/pr98-native-runtime.mjs
          node scripts/pr98-performance-sample.mjs
          node scripts/pr98-text-scaling.mjs
          node scripts/control-center-truth-runtime.mjs
          node scripts/control-center-ped-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-center-truth-${{ env.CANDIDATE_SHA }}
          path: |
            control-center-truth-audit/
            control-center-audit/
            audit/pr98-final/
          retention-days: 30
