name: Creative compliance offline validator (R109; manual only)
# INCIDENT P04: legacy autonomous approvals decommissioned. This workflow stays manually disabled.
# Never add schedule, ADMIN_PIN, network access or a mutation endpoint. No live creative data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove no automatic decision and fail-closed table C/P04 gates
        run: node --test tests/creative-auto-decision.test.mjs
      - name: Explicitly deny live approvals
        run: echo 'R109=READ_ONLY; P04=NOT_CERTIFIED; OWNER_DECISION=REQUIRED; LIVE_MUTATIONS=ZERO'
