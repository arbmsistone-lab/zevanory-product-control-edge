name: Full History Secret Audit
on:
  push:
    branches:
      - audit/full-history-secrets-20261002
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned scanners
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          curl -fsSL -o /tmp/trufflehog.tgz https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.9/trufflehog_3.97.9_linux_amd64.tar.gz
          tar -xzf /tmp/trufflehog.tgz -C /usr/local/bin trufflehog
          gitleaks version
          trufflehog --version
      - name: Scan complete git history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secret-audit
          set +e
          gitleaks git --redact=100 --report-format json --report-path secret-audit/gitleaks.json . >secret-audit/gitleaks.stdout 2>secret-audit/gitleaks.stderr
          GL=$?
          trufflehog git file://"$PWD" --json --no-update --fail >secret-audit/trufflehog.raw.jsonl 2>secret-audit/trufflehog.stderr
          TH=$?
          set -e
          if [ -s secret-audit/trufflehog.raw.jsonl ]; then
            jq -c 'del(.Raw,.RawV2,.ExtraData)' secret-audit/trufflehog.raw.jsonl > secret-audit/trufflehog.jsonl
          else
            : > secret-audit/trufflehog.jsonl
          fi
          rm -f secret-audit/trufflehog.raw.jsonl
          GL_COUNT=$(jq 'length' secret-audit/gitleaks.json 2>/dev/null || echo 0)
          TH_COUNT=$(wc -l < secret-audit/trufflehog.jsonl | tr -d ' ')
          TH_VERIFIED=$(jq -s '[.[] | select(.Verified == true)] | length' secret-audit/trufflehog.jsonl 2>/dev/null || echo 0)
          printf 'GITLEAKS_EXIT=%s\nGITLEAKS_FINDINGS=%s\nTRUFFLEHOG_EXIT=%s\nTRUFFLEHOG_FINDINGS=%s\nTRUFFLEHOG_VERIFIED=%s\n' "$GL" "$GL_COUNT" "$TH" "$TH_COUNT" "$TH_VERIFIED" | tee secret-audit/summary.txt
          test "$GL_COUNT" -eq 0
          test "$TH_VERIFIED" -eq 0
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-history-secret-audit
          path: secret-audit/
          if-no-files-found: error
