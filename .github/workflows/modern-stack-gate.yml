name: Modern Stack Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/modern-stack-gate.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'src/**'
      - '.github/workflows/modern-stack-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install modern toolchain
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit --noUnusedLocals false --noUnusedParameters false
      - name: Full production build and audits
        env:
          ZPC_BASE_PATH: /
        run: npm run build
      - name: Install browser auditors
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0 axe-core@4.10.3 lighthouse@12
          npx playwright install --with-deps chromium
      - name: Exhaustive zero-debt static audit
        run: python3 scripts/ped_versal_zero_debt_audit.py
      - name: Start production preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/zpc-modern-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/zpc-modern-preview.log
          exit 1
      - name: Audit 14 areas x 4 viewports x 2 themes
        env:
          CONTROL_CENTER_AUDIT_URL: http://127.0.0.1:4173
        run: node scripts/control-center-ped-runtime.mjs
      - name: Lighthouse production-candidate audit
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -n1 || true)"
          test -n "$CHROME_PATH"
          for i in 1 2 3; do
            npx lighthouse http://127.0.0.1:4173 --chrome-path="$CHROME_PATH" --chrome-flags="--headless=new --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices --output=json --output-path="modern-stack-lighthouse-$i.json" --quiet
          done
          cp modern-stack-lighthouse-2.json modern-stack-lighthouse.json
          node - <<'NODE'
          const runs=[1,2,3].map(i=>require('./modern-stack-lighthouse-'+i+'.json'));
          const scores=runs.map(r=>Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,Math.round(v.score*100)])));
          const med=k=>scores.map(x=>x[k]).sort((a,b)=>a-b)[1];
          const s={performance:med('performance'),accessibility:med('accessibility'),'best-practices':med('best-practices')};
          console.log(JSON.stringify({runs:scores,median:s}));
          if(s.performance<90||s.accessibility<100||s['best-practices']<95){console.log('::error title=LIGHTHOUSE_MEDIAN::'+JSON.stringify({median:s,runs:scores}));process.exit(1);}
          NODE
      - name: Verify dependency tree
        run: |
          npm ls react react-dom vite @vitejs/plugin-react typescript tsx
          npm audit --omit=dev --audit-level=high
