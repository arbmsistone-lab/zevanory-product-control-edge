name: Owner chat E3 integration (isolated)

# E3: certificação funcional integrada do chat do proprietário — painel (este repositório) + Worker do
# zevanory-public-mirror num SHA exato. Ambiente isolado: PIN, dados e sessões fictícios; nenhuma URL de produção
# é acessada (o teste aborta e registra qualquer pedido fora das origens simuladas). Sem deploy, sem segredos.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/e3/**'
      - '.github/workflows/owner-chat-e3-integration.yml'
  workflow_dispatch:
    inputs:
      public_mirror_sha:
        description: 'SHA exato do Worker candidato (zevanory-public-mirror, PR #1098)'
        required: true
        default: '30c9d51a66ea16c916f0eaa4381d84f42bccfe73'

permissions:
  contents: read

concurrency:
  group: owner-chat-e3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e3:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PM_SHA: ${{ github.event.inputs.public_mirror_sha || '30c9d51a66ea16c916f0eaa4381d84f42bccfe73' }}
    steps:
      - name: Checkout panel candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout Worker candidate (exact SHA)
        uses: actions/checkout@v4
        with:
          repository: arbmsistone-lab/zevanory-public-mirror
          ref: ${{ env.PM_SHA }}
          path: public-mirror
          persist-credentials: false
      - name: Verify exact SHAs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C public-mirror rev-parse HEAD)" = "$PM_SHA"
          echo "E3_PANEL_SHA=$(git rev-parse HEAD) E3_WORKER_SHA=$PM_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies and browser
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          # E1b: só a fonte apt da Microsoft (403 na imagem do runner); a verificação de assinatura segue ativa nas demais.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Worker owner-chat unit tests (candidate SHA)
        working-directory: public-mirror
        run: node --test tests/owner-chat-pin.test.mjs tests/owner-chat.test.mjs
      - name: Build panel candidate (no deploy)
        run: npx vite build
      - name: Start panel preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/zpc-e3-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/zpc-e3-preview.log; exit 1
      - name: Build MUTANT panel for the CA-10 counter-proof (origin/window check removed; never deployed)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/zpc-mutant && mkdir -p /tmp/zpc-mutant
          git archive HEAD | tar -x -C /tmp/zpc-mutant
          ln -s "$PWD/node_modules" /tmp/zpc-mutant/node_modules
          ANCHOR='if (event.origin !== OWNER_CHAT_ORIGIN || !frameRef.current || event.source !== frameRef.current.contentWindow) return;'
          grep -qF "$ANCHOR" /tmp/zpc-mutant/src/OwnerChatWidget.tsx
          python3 - <<'PYM'
          from pathlib import Path
          p=Path('/tmp/zpc-mutant/src/OwnerChatWidget.tsx');s=p.read_text()
          a='if (event.origin !== OWNER_CHAT_ORIGIN || !frameRef.current || event.source !== frameRef.current.contentWindow) return;'
          assert s.count(a)==1; p.write_text(s.replace(a,'if (false) return;'))
          PYM
          (cd /tmp/zpc-mutant && npx vite build >/tmp/zpc-mutant-build.log 2>&1 || (cat /tmp/zpc-mutant-build.log; exit 1))
          (cd /tmp/zpc-mutant && nohup npx vite preview --host 127.0.0.1 --port 4175 > /tmp/zpc-mutant-preview.log 2>&1 &)
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4175/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/zpc-mutant-preview.log; exit 1
      - name: E3 integration (${{ matrix.browser }})
        env:
          E3_BROWSER: ${{ matrix.browser }}
          PUBLIC_MIRROR_DIR: public-mirror
          PANEL_MUTANT: http://127.0.0.1:4175
        run: node scripts/e3/owner-chat-e3.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-chat-e3-${{ matrix.browser }}
          path: e3-evidence/
          retention-days: 90
