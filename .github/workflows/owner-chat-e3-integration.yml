name: Owner chat E3 integration (isolated)

# E3: certificação funcional integrada do chat do proprietário — painel (este repositório) + Worker do
# zevanory-public-mirror num SHA exato. Ambiente isolado: PIN, dados e sessões fictícios; sessões e tentativas de PIN
# num PostgreSQL 16 real e descartável (serviço do job); nenhuma URL de produção é acessada (o teste aborta e registra
# qualquer pedido fora das origens simuladas). Sem deploy, sem segredos.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/e3/**'
      - '.github/workflows/owner-chat-e3-integration.yml'
  workflow_dispatch:
    inputs:
      public_mirror_sha:
        description: 'SHA exato do Worker candidato (zevanory-public-mirror, PR #1106)'
        required: true
        default: 'c4e135a2e45c11159762e2c46923552c0731b98f'

permissions:
  contents: read

concurrency:
  group: owner-chat-e3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e3:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PM_SHA: ${{ github.event.inputs.public_mirror_sha || 'c4e135a2e45c11159762e2c46923552c0731b98f' }}
    steps:
      - name: Checkout panel candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout Worker candidate (exact SHA)
        uses: actions/checkout@v4
        with:
          repository: arbmsistone-lab/zevanory-public-mirror
          ref: ${{ env.PM_SHA }}
          path: public-mirror
          persist-credentials: false
          fetch-depth: 0  # R1.2: a prova de rollback extrai o Worker de produção (813870c2) do histórico
      - name: Verify exact SHAs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C public-mirror rev-parse HEAD)" = "$PM_SHA"
          echo "E3_PANEL_SHA=$(git rev-parse HEAD) E3_WORKER_SHA=$PM_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies and browser
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          # E1b: só a fonte apt da Microsoft (403 na imagem do runner); a verificação de assinatura segue ativa nas demais.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Worker owner-chat unit tests (candidate SHA)
        working-directory: public-mirror
        run: node --test tests/owner-chat-pin.test.mjs tests/owner-chat.test.mjs tests/owner-panel-bridge.test.mjs
      - name: PostgreSQL 16 real — sessão, concorrência, O1, rollback e contraprovas do Worker (candidate SHA)
        working-directory: public-mirror
        env:
          T4_PG_HOST: localhost
          T4_PG_PORT: '5432'
        shell: bash
        run: |
          set -eo pipefail
          v="$(psql -h localhost -U postgres -tAc 'show server_version_num')"; [ "${v:0:2}" = "16" ]
          echo "E3_POSTGRES_VERSION_NUM=$v"
          mkdir -p ../e3-evidence/${{ matrix.browser }}
          node --test tests/integration/owner-chat-session-postgres.test.mjs tests/integration/owner-chat-rollback-postgres.test.mjs tests/integration/owner-chat-schema-migration-postgres.test.mjs 2>&1 | grep -v '"event":"owner_chat_pin_failed"' | tee ../e3-evidence/${{ matrix.browser }}/postgres-integration.txt
          grep -qx "# tests 16" ../e3-evidence/${{ matrix.browser }}/postgres-integration.txt
          grep -qx "# pass 16" ../e3-evidence/${{ matrix.browser }}/postgres-integration.txt
          test "$(grep -c '=DETECTED$' ../e3-evidence/${{ matrix.browser }}/postgres-integration.txt)" = "9"
      - name: Build panel candidate (no deploy)
        run: npx vite build
      - name: Start panel preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/zpc-e3-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/zpc-e3-preview.log; exit 1
      - name: Build MUTANT panel for the logout counter-proof (Sair do painel sem encerrar o chat; never deployed)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/zpc-mutant && mkdir -p /tmp/zpc-mutant
          git archive HEAD | tar -x -C /tmp/zpc-mutant
          ln -s "$PWD/node_modules" /tmp/zpc-mutant/node_modules
          python3 - <<'PYM'
          from pathlib import Path
          p=Path('/tmp/zpc-mutant/src/App.tsx');s=p.read_text()
          a='    try { await ownerChatRef.current?.endSession(); } catch { /* sem confirmação: a sessão do chat vence em até 5 min */ }'
          assert s.count(a)==1; p.write_text(s.replace(a,'    void ownerChatRef;'))
          PYM
          (cd /tmp/zpc-mutant && npx vite build >/tmp/zpc-mutant-build.log 2>&1 || (cat /tmp/zpc-mutant-build.log; exit 1))
          (cd /tmp/zpc-mutant && nohup npx vite preview --host 127.0.0.1 --port 4175 > /tmp/zpc-mutant-preview.log 2>&1 &)
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4175/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/zpc-mutant-preview.log; exit 1
      - name: E3-D Epaminondas fixo na coluna, sem PIN (${{ matrix.browser }})
        env:
          E3_BROWSER: ${{ matrix.browser }}
          PUBLIC_MIRROR_DIR: public-mirror
          PANEL_MUTANT_NO_END: http://127.0.0.1:4175
          E3_PG_HOST: localhost
          E3_PG_PORT: '5432'
        shell: bash
        run: |
          set -eo pipefail
          node scripts/e3/owner-chat-dock-e3.mjs | tee /tmp/dock.txt
          grep -qx "OWNER_CHAT_DOCK_E3_$(echo ${{ matrix.browser }} | tr a-z A-Z)=PASS positives=12/12" /tmp/dock.txt
          grep -qx "DETECTED panel:no-end-session -> panel_logout_revokes_now" /tmp/dock.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-chat-e3-${{ matrix.browser }}
          path: |
            e3-evidence/
            e3-dock-evidence/
          retention-days: 90
