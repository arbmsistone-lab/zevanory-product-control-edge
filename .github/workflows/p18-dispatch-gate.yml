name: P18 dispatch gate

# AVAL Sol 253/254: behavioural tests (mocked fetch/KV, real scheduled()) and mutants of the P18 external trigger
# (cf-worker/p18-dispatch.ts). Pull request only: never fires on merge, no secrets, no network beyond checkout and
# npm install. Exact counts: 16 tests, 15 mutants KILLED.
on:
  pull_request:
    branches: [main]
    paths:
      - 'cf-worker/**'
      - 'scripts/p18-dispatch.test.ts'
      - 'scripts/p18-dispatch.mutants.mjs'
      - 'package.json'
      - '.github/workflows/p18-dispatch-gate.yml'

permissions:
  contents: read

jobs:
  p18-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Tests (exact count 16)
        run: |
          set -euo pipefail
          npm run test:p18-dispatch 2>&1 | tee p18.txt
          grep -qx "p18-dispatch: 16 tests passed" p18.txt
          grep -E "^P18_CPU_PER_INVOCATION_MS=" p18.txt | sed 's/^/::notice title=P18_CPU::/'
      - name: Mutants (15, all KILLED)
        run: |
          set -euo pipefail
          npm run mutants:p18-dispatch 2>&1 | tee mut.txt
          grep -q '"mutants":15,"KILLED":15,"other":\[\]' mut.txt
