name: PR120 HA External Smoke

on:
  push:
    branches:
      - ops/pr120-ha-smoke-e60c0fb2

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke HA safe endpoints
        shell: bash
        run: |
          set -euo pipefail
          base='https://zevanory-product-control-edge-ha.onrender.com'
          health="$(curl -fsS --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30 "$base/api/_healthcheck")"
          release="$(curl -fsS --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30 "$base/api/_release")"
          printf '%s\n' "$health"
          printf '%s\n' "$release"
          echo "$health" | grep -F '"ok":true'
          echo "$release" | grep -F '"ok":true'
          echo 'HA_SMOKE=PASS'
