name: PR121 primary smoke

on:
  push:
    branches: [ops/pr121-ha-smoke-20261002]
    paths: [".github/workflows/pr121-ha-smoke.yml"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke primary without portable-health
        shell: bash
        run: |
          set -euo pipefail
          base="https://zevanory-product-control-edge.onrender.com"
          for i in $(seq 1 24); do
            if curl -fsS "$base/api/_healthcheck" -o /tmp/health.json; then
              jq -e '.ok == true' /tmp/health.json >/dev/null && break
            fi
            sleep 5
          done
          jq -e '.ok == true' /tmp/health.json >/dev/null
          curl -fsS "$base/api/_auth_diagnostic" -o /tmp/auth.json
          jq -e '.secretValid == true and .locked == false' /tmp/auth.json >/dev/null
          echo "PRIMARY_SMOKE=PASS"
          echo "PORTABLE_HEALTH_USED=NO"
