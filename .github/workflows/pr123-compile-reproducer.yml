name: PR123 Compile Reproducer

on:
  push:
    branches:
      - fix/premium-panel-a-cleanup-20261002
    paths:
      - "backend/**"
      - "src/**"
      - "scripts/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pr123-compile-reproducer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr123-compile-reproducer
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run typecheck && npm run build
