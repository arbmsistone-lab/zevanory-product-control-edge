name: PR98 Authenticated Authority Readback
on:
  pull_request:
    branches: [main]
    paths: ['scripts/pr98-authority-readback.mjs', '.github/workflows/pr98-authority-readback.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read current authorities without mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node scripts/pr98-authority-readback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr98-authority-readback-${{ env.CANDIDATE_SHA }}
          path: pr98-authority-readback/
          if-no-files-found: error
          retention-days: 30
