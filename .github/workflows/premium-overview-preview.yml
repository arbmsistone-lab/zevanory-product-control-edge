name: Premium Overview Preview

on:
  push:
    branches:
      - fix/premium-panel-a-cleanup-20261002
    paths:
      - "src/**"
      - "scripts/premium-overview-preview.mjs"
      - "package.json"
      - ".github/workflows/premium-overview-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: premium-overview-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Build preview
        run: npx vite build
      - name: Start preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 4173 >/tmp/premium-overview-vite.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/premium-overview-vite.log
          exit 1
      - name: Capture light and dark previews
        run: node scripts/premium-overview-preview.mjs
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-overview-preview-${{ github.run_id }}
          path: premium-overview-preview/
          retention-days: 30
          if-no-files-found: error
      - name: Publish previews to review branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d premium-overview-preview || exit 0
          src_sha="$(git rev-parse HEAD)"
          rm -rf /tmp/review && mkdir -p /tmp/review && cp premium-overview-preview/* /tmp/review/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan review/premium-overview-preview
          git rm -rfq . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/review/* .
          echo "$src_sha" > SOURCE_SHA
          git add -A
          git commit -qm "preview: premium overview screenshots for $src_sha"
          git push -f origin HEAD:review/premium-overview-preview
          echo "REVIEW_BRANCH=review/premium-overview-preview SOURCE_SHA=$src_sha"
