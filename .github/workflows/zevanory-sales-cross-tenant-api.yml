    branches:
      - test/zevanory-sales-api-cross-tenant-20261002
permissions:
  contents: read
jobs:
  attack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
