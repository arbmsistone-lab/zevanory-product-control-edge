name: ZEVANORY Sales Cross-Tenant Attack
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/commercial.ts'
      - 'src/zevanory-sales-model.ts'
      - 'scripts/zevanory-sales-cross-tenant-attack.ts'
      - '.github/workflows/zevanory-sales-cross-tenant-attack.yml'
  push:
    branches: [main]
    paths:
      - 'backend/commercial.ts'
      - 'src/zevanory-sales-model.ts'
      - 'scripts/zevanory-sales-cross-tenant-attack.ts'
      - '.github/workflows/zevanory-sales-cross-tenant-attack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attack-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npx tsx scripts/zevanory-sales-cross-tenant-attack.ts
