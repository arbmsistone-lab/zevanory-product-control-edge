name: ZPC Canonical Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'backend/**'
      - 'cf-worker/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'CANONICAL_DEPLOYMENT.md'
      - 'RECONCILIATION.md'
      - '.github/workflows/zpc-canonical-build.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zpc-canonical-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit --noUnusedLocals false --noUnusedParameters false

      - name: Guard canonical ZEES baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q "zeesSealGrid" src/App.tsx
          grep -q "shell-products" src/index.css
          grep -q "P01" backend/zees-verifiers.ts
          grep -q "P16" backend/zees-verifiers.ts
          grep -q "controle.zevanory.api.br" CANONICAL_DEPLOYMENT.md
          grep -q "controle.zevanory.api.br" RECONCILIATION.md
          ! grep -q "Com tecnologia Netlify" src/App.tsx
          grep -q "overflow: hidden" src/index.css
          grep -q "global-trust.json" src/App.tsx

      - name: Build remotely
        env:
          ZPC_BASE_PATH: /
        run: npm run build

      - name: Capture live global trust
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 \
            https://zevanory.api.br/api/core/v1/snapshot \
            -o /tmp/core-snapshot.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 \
            https://zevanory.api.br/api/core/v1/decision \
            -o /tmp/core-decision.json

          jq -e '.release_sha and .zees16.counts and .zea10.counts and ((.continuity.quorum_ok | type) == "boolean")' /tmp/core-snapshot.json >/dev/null
          jq -e '.decision and .checks and .eligible_for_critical_promotion != null' /tmp/core-decision.json >/dev/null

          jq -n \
            --slurpfile s /tmp/core-snapshot.json \
            --slurpfile d /tmp/core-decision.json \
            '($s[0]) as $s | ($d[0]) as $d |
             ($s.continuity.min_quorum // 3) as $required |
             (($s.continuity.quorum_ok == true) and
              (($s.zees16.counts.proven // 0) == 16) and
              (($s.zees16.counts.partial // 0) == 0) and
              (($s.zees16.counts.blocked // 0) == 0) and
              (($s.zea10.counts.proven // 0) == 10) and
              (($s.zea10.counts.partial // 0) == 0) and
              (($s.zea10.counts.blocked // 0) == 0) and
              (($s.zea10.counts.unknown // 0) == 0) and
              ($d.decision == "ALLOW") and
              ($d.eligible_for_critical_promotion == true) and
              (($d.blockers // []) | length == 0)) as $green |
             {
               state: (if $green then "GREEN" else "BLOCKED" end),
               sha: ($s.release_sha // $d.release_sha // null),
               evidenceRoot: ($s.zees16.decision_hash // $d.zees16_decision_hash // null),
               policyVersion: ($s.zea10.evaluator // $s.zea10.framework // "ZEA-10"),
               quorum: {
                 passed: (if $s.continuity.quorum_ok == true then $required else 0 end),
                 total: $required,
                 required: $required,
                 conflicts: 0,
                 independentKeys: 0
               },
               zea10: {
                 proven: ($s.zea10.counts.proven // 0),
                 partial: ($s.zea10.counts.partial // 0),
                 blocked: (($s.zea10.counts.blocked // 0) + ($s.zea10.counts.unknown // 0))
               },
               engines: [
                 {id:"zees16-core", state:(if (($s.zees16.counts.proven // 0) == 16 and ($s.zees16.counts.partial // 0) == 0 and ($s.zees16.counts.blocked // 0) == 0) then "GREEN" else "BLOCKED" end)},
                 {id:"zea10-evaluator", state:(if (($s.zea10.counts.proven // 0) == 10 and ($s.zea10.counts.partial // 0) == 0 and ($s.zea10.counts.blocked // 0) == 0 and ($s.zea10.counts.unknown // 0) == 0) then "GREEN" else "BLOCKED" end)},
                 {id:"control-core", state:(if ($d.decision == "ALLOW" and $d.eligible_for_critical_promotion == true and (($d.blockers // []) | length == 0)) then "GREEN" else "BLOCKED" end)}
               ],
               checkedAt: ($s.generated_at // $d.generated_at // null),
               snapshotAt: (now | todateiso8601),
               source: "https://zevanory.api.br/api/core/v1/snapshot + /api/core/v1/decision"
             }' > dist/global-trust.json

          jq -e '.state and .quorum and .zea10 and .engines' dist/global-trust.json >/dev/null

      - name: Stamp exact lineage
        shell: bash
        run: |
          printf '{"sha":"%s","repository":"%s","workflow_run":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/zpc-build.json

      - name: Upload canonical artifact
        uses: actions/upload-artifact@v4
        with:
          name: zpc-canonical-dist
          path: dist
          retention-days: 7
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy automatic origin
        id: deployment
        uses: actions/deploy-pages@v4
