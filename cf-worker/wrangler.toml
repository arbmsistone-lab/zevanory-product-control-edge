name = "zevanory-product-control-portable"
main = "worker.ts"
compatibility_date = "2026-09-19"

routes = [
  { pattern = "controle.zevanory.api.br", custom_domain = true },
  { pattern = "zevanory.api.br/control*", zone_name = "zevanory.api.br" }
]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
SUPABASE_URL = "https://pvkpkqwdnnpkgvllwqbc.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IAPNVvyZRbgLjiaEdArk_g_6qd3Dp_-"
RENDER_BACKEND_URL = "https://zevanory-product-control-edge.onrender.com"
BACKEND_INSTANCE_ID = "cloudflare"

[ai]
binding = "AI"

# Direct, egress-free read of ZEVANORY Control Core for the live trust strip (no extra cost).
[[services]]
binding = "CORE_WORKER"
service = "zevanory"

[[kv_namespaces]]
binding = "T2_CREATIVE_ASSETS"
id = "728a45738e4047f29bcb89934fd533c1"

[[ratelimits]]
name = "PIN_LIMITER"
namespace_id = "1701"
simple = { limit = 5, period = 60 }

# One Cron Trigger (Workers Free: 5 per account, shared with the central Worker's 3). */5 since AVAL Sol 253/254:
# every invocation requests the P18 external monitor (workflow_dispatch, window id) and reads its heartbeat; the
# legacy duties (commercial robot tick, Meta publisher, shared activity) still run only at minutes 0/15/30/45.
# Secret (owner, never in this file): P18_DISPATCH_TOKEN, a fine-grained token with Actions: write on
# arbmsistone-lab/zevanory-public-mirror only. Without it the dispatch is "unconfigured" (alerted daily) and the
# heartbeat watch still runs.
[triggers]
crons = ["*/5 * * * *"]
